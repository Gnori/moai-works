# 자동 테스트 설정 — @ApiTest 가 "test" 프로파일로 켠다.
#
# DB: 개발 DB(moai_works)의 public 스키마를 건드리지 않게, 같은 DB 안의 시험 전용 스키마 moai_works_test 를 쓴다.
#     (DB 계정에 CREATE DATABASE 권한이 없다. 스키마는 만들 수 있다.)
#     테스트가 시작할 때 이 스키마를 비우고 Flyway 로 다시 만든다 — 스키마 이름이 다르면 TestInfrastructure 가 막는다.
#     여러 worktree 에서 함께 돌릴 때는 MOAI_WORKS_TEST_DB_SCHEMA=moai_works_test_<이름> 으로 서로 다른 스키마를 쓴다.
#     계정 · 비밀번호는 개발과 같은 env(MOAI_WORKS_DB_USERNAME · MOAI_WORKS_DB_PASSWORD, 모듈 폴더의 .env).
# Keycloak: 부르지 않는다 — 관리 API 는 FakeKeycloak, 토큰은 시험용 키(TestTokens)로 만든다.

spring:
  datasource:
    url: ${MOAI_WORKS_TEST_DB_URL:jdbc:postgresql://localhost:5432/moai_works?currentSchema=${MOAI_WORKS_TEST_DB_SCHEMA:moai_works_test}}
  flyway:
    schemas: ${MOAI_WORKS_TEST_DB_SCHEMA:moai_works_test}
    default-schema: ${MOAI_WORKS_TEST_DB_SCHEMA:moai_works_test}
    clean-disabled: false

moai-works:
  keycloak:
    url: http://keycloak.test.invalid
    realm: moai-works
    client-id: moai-works-api
    client-secret: not-used-in-tests
  security:
    # 시험 전용 값이다(비밀값 아님). 운영 값은 env 로만 넣는다.
    code-secret: test-only-code-secret-0123456789abcdef
  mail:
    mode: log
    # 알림 메일 보내기는 시험이 직접 부른다(NotificationMailSender.sendDue) — 정해진 시각에는 돌지 않는다
    outbox-cron: "-"
  storage:
    # 테스트는 저장소를 부르지 않는다 — 메모리 저장소(MemoryObjectStore)를 쓴다
    endpoint: http://storage.test.invalid
    attachment-bucket: test-attachments
    access-key: not-used-in-tests
    secret-key: not-used-in-tests
    max-file-mb: 1
